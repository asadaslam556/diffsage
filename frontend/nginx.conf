# Serves the built SPA and forwards /api to the backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 200k-char uploads get bigger once JSON-escaped (quotes, newlines, UTF-8)
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # nginx is the edge, so overwrite rather than append: a client-supplied
        # X-Forwarded-For must never reach the per-IP rate limiter
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # streaming: don't hold tokens back in a buffer, and give slow models time
        proxy_buffering off;
        proxy_cache off;
        # above the Ollama provider timeout (600s): a cold model load on CPU sends
        # nothing for minutes, and cutting it here drops the stream without an error
        proxy_read_timeout 660s;
        chunked_transfer_encoding on;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # client-side routes (/chat/123, /settings) all get index.html.
    # Security headers live per location because any add_header in a location
    # drops the server-level ones; /api/ gets its own from the backend.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}
