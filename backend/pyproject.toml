[project]
name = "diffsage-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 180  # the codebase is written wide on purpose; long signatures read better on one line
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the whole point
