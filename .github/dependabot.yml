# Weekly, one grouped PR per ecosystem so updates don't bury the repo.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    groups: { images: { patterns: ["*"] } }
    ignore:
      # a major Postgres/Redis jump needs a data migration, not a routine bump
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
